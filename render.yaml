# Render Blueprint for the BubbleLab MVP.
# Docs consulted (2026-08-13): https://render.com/docs/blueprint-spec,
# https://render.com/docs/private-services, https://render.com/docs/private-network,
# https://render.com/docs/free (confirms private services have no free tier)
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file, provisions everything below, and prompts once for every
# `sync: false` env var (never stored in the repo).
#
# Architecture: bubble-studio (static, always-on CDN, no cold start) and
# bubblelab-api are both public web services; builder-agent is ALSO a public
# web service (not Render's genuinely private `pserv` type — that has no
# free tier, confirmed at render.com/docs/free, $7/mo minimum). Since
# builder-agent's URL is technically internet-reachable, every request to it
# must carry a shared-secret header (BUILDER_AGENT_SECRET) or it 401s — see
# builderAuthHeaders() in apps/bubblelab-api/src/services/builder-runtime.ts
# and the request-gating middleware in services/builder-agent/src/index.ts.
# This is an application-layer substitute for real network isolation, not
# equivalent to it: the URL is discoverable and probeable, just useless
# without the secret. Postgres is shared by all three services.
#
# Cost: $0/month, everything free tier.

databases:
  - name: bubblelab-db
    plan: free
    databaseName: bubblelab
    user: bubblelab

services:
  # --- Backend API (public) ---------------------------------------------
  - name: bubblelab-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bubblelab-db
          property: connectionString
      - key: BUBBLE_ENV
        value: production
      - key: DISABLE_AUTH
        value: 'true'
      # Render web services are always served over TLS at a deterministic
      # https://<name>.onrender.com address — safe to hardcode since these
      # names are this same file's own fixed service names.
      - key: NODEX_API_URL
        value: https://bubblelab-api.onrender.com
      - key: BUILDER_AGENT_URL
        value: https://builder-agent.onrender.com
      # Shared secret every request to builder-agent must carry (see the
      # architecture note above). fromService/envVarKey reads it from
      # builder-agent's own generated value below, so both sides always
      # agree — never generated independently on each service.
      - key: BUILDER_AGENT_SECRET
        fromService:
          name: builder-agent
          type: web
          envVarKey: BUILDER_AGENT_SECRET
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # The Telegram bot's GET /wake?secret=... trigger. Auto-generated so
      # only whoever reads it from the Render Dashboard can call /wake.
      - key: WAKE_SECRET
        generateValue: true
      # The fixed link /wake hands back to the bot for the human to open.
      # Static sites use the same https://<name>.onrender.com pattern as web
      # services (custom domain: replace this literal after adding one).
      - key: STUDIO_URL
        value: https://bubble-studio.onrender.com
      # Secrets a human must paste into the Render Dashboard once — never
      # stored in this repo (Render's `sync: false` prompt, per
      # https://render.com/docs/blueprint-spec).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FIRE_CRAWL_API_KEY
        sync: false

  # --- Builder-agent sidecar (public web service, free tier — locked down
  #     with BUILDER_AGENT_SECRET, not Render network isolation) ----------
  - name: builder-agent
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.builder-agent
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BUILDER_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: bubblelab-db
          property: connectionString
      - key: GLUU_API_URL
        value: https://bubblelab-api.onrender.com
      # The gate every non-/health request must pass (see architecture note
      # above). Generated once, here; bubblelab-api reads this exact value
      # via fromService/envVarKey so the two can never drift apart.
      - key: BUILDER_AGENT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BUILDER_MODEL
        value: z-ai/glm-5.2
      # This service is NOT spawned by bubblelab-api as a child process here
      # — it's its own independent Render service — so its own serve-
      # identity stamp should read 'external', matching how it's actually
      # running (config.ts's serveMode default). 'managed' would misreport
      # its own SERVED_BY telemetry.
      - key: BUILDER_SERVE_MODE
        value: external

  # --- Studio frontend (static, always-on, no sleep/cold-start) ----------
  - name: bubble-studio
    type: web
    runtime: static
    rootDir: .
    buildCommand: >-
      export HUSKY=0 CI=true && corepack enable &&
      pnpm install --frozen-lockfile &&
      cd packages/bubble-shared-schemas && pnpm run build &&
      cd ../bubble-core && pnpm run build &&
      cd ../../apps/bubble-studio && pnpm run build
    staticPublishPath: ./apps/bubble-studio/dist
    envVars:
      - key: VITE_API_URL
        value: https://bubblelab-api.onrender.com
      - key: VITE_DISABLE_AUTH
        value: 'true'
